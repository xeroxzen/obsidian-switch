[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-switch"
version = "1.1.0"
description = "Clean-room simulator showing how payment integration bugs lose merchants money, and the fixes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "oppwa-guard",
    "spoofscore",
]

[project.scripts]
obsidian-switch = "obsidian.main:main"

[tool.setuptools.packages.find]
include = ["obsidian*"]

[tool.setuptools.package-data]
"obsidian.tui" = ["*.tcss"]

[tool.uv.sources]
oppwa-guard = { git = "https://github.com/xeroxzen/oppwa-guard" }
spoofscore = { git = "https://github.com/xeroxzen/spoofscore" }

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = false
